{% extends "theme/base.html" %}
{% block content %}
<div class="container-xl">
  <div class="page-header d-print-none" aria-label="Page header">
    <div class="row align-items-center">
      <div class="col">
        <div class="page-pretitle">Page Not Found</div>
        <h1 class="page-title mb-0">404 — Page not found</h1>
      </div>
    </div>
  </div>
  <br>

  <div class="card">
    <div class="card-body text-center py-5">
      <i class="fas fa-exclamation-circle text-muted fa-3x mb-3"></i>
      <h3>The page you’re looking for isn’t here.</h3>
      <p class="text-muted">
        We couldn’t find anything at <strong>{{ path }}</strong>. It may have
        been moved or deleted.
      </p>
      <div class="d-grid gap-2 d-sm-flex justify-content-center mt-4">
        <a href="{% url 'dashboard' %}" class="btn btn-primary">
          <i class="fas fa-home me-1"></i>Back to dashboard
        </a>
        <a href="javascript:history.back()" class="btn btn-outline-secondary">
          <i class="fas fa-arrow-left me-1"></i>Go back
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
