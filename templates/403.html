{% extends "theme/base.html" %}
{% block content %}
<div class="container-xl">
  <div class="page-header d-print-none" aria-label="Page header">
    <div class="row align-items-center">
      <div class="col">
        <div class="page-pretitle">Forbidden</div>
        <h1 class="page-title mb-0">403 — Forbidden</h1>
      </div>
    </div>
  </div>
  <br>

  <div class="card border-warning">
    <div class="card-body text-center py-5">
      <i class="fas fa-lock text-warning fa-3x mb-3"></i>
      <h3>You don’t have permission to view this page.</h3>
      <p class="text-muted">
        Your account isn’t allowed to access this area. If you believe this is
        a mistake, contact your agency administrator.
      </p>
      <div class="d-grid gap-2 d-sm-flex justify-content-center mt-4">
        <a href="{% url 'dashboard' %}" class="btn btn-primary">
          <i class="fas fa-home me-1"></i>Back to dashboard
        </a>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit" class="btn btn-outline-secondary">
            <i class="fas fa-sign-out-alt me-1"></i>Sign in as another account
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
