{% if row.profile.contact_number %}
<a href="tel:{{ row.profile.contact_number }}" class="btn btn-sm btn-success">
  <i class="fas fa-phone me-1"></i> Call
</a>
{% endif %}
<form method="post" action="{% url 'ofw:request_ofw_location' row.profile.pk %}" class="d-inline">
  {% csrf_token %}
  <button type="submit" class="btn btn-sm btn-outline-primary"
          title="Ask the OFW to share their location">
    <i class="fas fa-location-crosshairs me-1"></i> Request location
  </button>
</form>
<a href="{% url 'ofw:emergency_guide' row.profile.pk %}" class="btn btn-sm btn-outline-danger">
  <i class="fas fa-headset me-1"></i> Guide
</a>
