{% extends "theme/base.html" %}
{% block content %}
<div class="container-xl">
  <div class="page-header d-print-none" aria-label="Page header">
    <div class="row align-items-center">
      <div class="col">
        <div class="page-pretitle">Server Error</div>
        <h1 class="page-title mb-0">500 — Server error</h1>
      </div>
    </div>
  </div>
  <br>

  <div class="card border-danger">
    <div class="card-body text-center py-5">
      <i class="fas fa-triangle-exclamation text-danger fa-3x mb-3"></i>
      <h3>Something went wrong on our end.</h3>
      <p class="text-muted">
        We’ve been notified of the error. Please try again, or contact your
        agency if the problem keeps happening.
      </p>
      <div class="d-grid gap-2 d-sm-flex justify-content-center mt-4">
        <a href="{% url 'dashboard' %}" class="btn btn-primary">
          <i class="fas fa-home me-1"></i>Back to dashboard
        </a>
        <button type="button" class="btn btn-outline-secondary" onclick="location.reload();">
          <i class="fas fa-rotate-right me-1"></i>Try again
        </button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
