{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>Reset Password - KabayaniTrack</title>
  <link href="{% static 'css/tabler.css' %}" rel="stylesheet" />
  <link href="{% static 'css/app-theme.css' %}" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <script src="{% static 'js/tabler-theme.js' %}"></script>
  <div class="page page-center">
    <div class="container container-tight py-4">
      <div class="card card-md">
        <div class="card-body">
          <div class="text-center mt-n4 mb-4">
            <div class="d-flex justify-content-center mb-2">
              <img src="{% static 'img/kabayanitrack-logo.svg' %}" alt="KabayaniTrack logo" class="dh-brand-logo" style="width:2.5rem; height:2.5rem;">
            </div>
            <div class="dh-brand-name lh-1" style="font-size: 2rem;">KabayaniTrack</div>
          </div>
          <h2 class="h3 text-center mb-2">Forgot password?</h2>
          <p class="text-muted mb-4 text-center">Enter your email address and we'll send you a link to reset your password.</p>
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label">Email address</label>
              <input type="email" name="email" class="form-control" autocomplete="email" required>
              {% if form.email.errors %}
              <div class="invalid-feedback d-block">{{ form.email.errors|join:', ' }}</div>
              {% endif %}
            </div>
            <div class="form-footer">
              <button type="submit" class="btn btn-primary w-100">Send reset link</button>
            </div>
          </form>
          <div class="text-center text-secondary mt-3">
            <a href="{% url 'login' %}">Back to sign in</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="{% static 'js/tabler.js' %}" defer></script>
</body>
</html>
