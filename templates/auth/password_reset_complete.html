{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>Password Reset Complete - KabayaniTrack</title>
  <link href="{% static 'css/tabler.css' %}" rel="stylesheet" />
  <link href="{% static 'css/app-theme.css' %}" rel="stylesheet" />
</head>
<body>
  <script src="{% static 'js/tabler-theme.js' %}"></script>
  <div class="page page-center">
    <div class="container container-tight py-4">
      <div class="card card-md">
        <div class="card-body text-center">
          <div class="mb-3">
            <span class="avatar avatar-lg bg-green-lt"><i class="fas fa-check"></i></span>
          </div>
          <h2 class="h3 mb-2">Password reset successful</h2>
          <p class="text-muted mb-4">Your password has been set. You can now sign in with your new password.</p>
          <a href="{% url 'login' %}" class="btn btn-primary">Sign in</a>
        </div>
      </div>
    </div>
  </div>
  <script src="{% static 'js/tabler.js' %}" defer></script>
</body>
</html>
