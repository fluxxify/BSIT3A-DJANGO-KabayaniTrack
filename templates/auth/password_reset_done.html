{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>Reset Link Sent - KabayaniTrack</title>
  <link href="{% static 'css/tabler.css' %}" rel="stylesheet" />
  <link href="{% static 'css/app-theme.css' %}" rel="stylesheet" />
</head>
<body>
  <script src="{% static 'js/tabler-theme.js' %}"></script>
  <div class="page page-center">
    <div class="container container-tight py-4">
      <div class="card card-md">
        <div class="card-body text-center">
          <div class="mb-3">
            <span class="avatar avatar-lg bg-green-lt"><i class="fas fa-key"></i></span>
          </div>
          <h2 class="h3 mb-2">Reset link ready</h2>
          <p class="text-muted mb-3">Click the button below to set a new password for your account.</p>
          {% if reset_url %}
          <a href="{{ reset_url }}" class="btn btn-primary w-100 mb-2">Reset your password</a>
          {% else %}
          <p class="text-muted small">If an account exists with {{ email }}, you can reset your password.</p>
          <a href="{% url 'login' %}" class="btn btn-outline-primary">Back to sign in</a>
          {% endif %}
          <div class="text-center text-secondary mt-3">
            <a href="{% url 'login' %}">Back to sign in</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="{% static 'js/tabler.js' %}" defer></script>
</body>
</html>
